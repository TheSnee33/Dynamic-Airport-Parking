<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Dynamic Airport Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login">
<div class="page-hero"><div class="wrap"><h1>Welcome back</h1><p>Log in to see your bookings and pay.</p></div></div>

<section class="block">
  <div class="wrap">
    <div id="unconfigured"></div>
    <div class="form-card" id="card">
      <div id="msg" class="msg" role="alert"></div>
      <form id="form" novalidate>
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
        <button class="btn block" type="submit" id="go">Log In</button>
        <div class="form-foot"><button type="button" class="link-btn" id="forgot">Forgot Your Password?</button></div>
        <div class="form-foot">New here? <a href="register.html" id="to-register">Create an account</a></div>
      </form>
    </div>
  </div>
</section>

<script src="assets/js/config.js"></script>
<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/login.js"></script>
</body>
</html>
