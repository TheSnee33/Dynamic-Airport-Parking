<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Staff Board — Dynamic Airport Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="staff">
<div class="page-hero"><div class="wrap"><h1>Staff Board</h1><p>Every parking reservation in one place, for Dynamic Collision Repair staff.</p>
  <p style="margin-top:16px"><a class="btn small dark" id="collisionAdminBtn" href="https://dynamiccollisionprovo.com/admin.html">&larr; Dynamic Collision Admin</a></p></div></div>

<section class="block">
  <div class="wrap">
    <div id="unconfigured"></div>
    <div id="msg" class="msg" role="status" style="margin-bottom:18px"></div>
    <div id="denied" class="notice warn" style="display:none"></div>
    <div id="app" style="display:none">
      <div class="res-top" style="margin-bottom:16px">
        <div class="staff-filters" id="filters">
          <button type="button" class="btn small" data-f="active">Active</button>
          <button type="button" class="btn small ghost" data-f="today">Today</button>
          <button type="button" class="btn small ghost" data-f="review">Needs Review</button>
          <button type="button" class="btn small ghost" data-f="all">All</button>
        </div>
        <div><span class="muted" id="count"></span> <button type="button" class="btn small dark" id="refresh">Refresh</button></div>
      </div>
      <div id="list"><div class="spinner"></div></div>
    </div>
  </div>
</section>

<script src="assets/js/config.js"></script>
<script type="module" src="assets/js/main.js"></script>
<script type="module" src="assets/js/staff.js"></script>
</body>
</html>
